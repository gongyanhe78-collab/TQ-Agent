name: 后端与前端质量门禁

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: 后端编译、迁移与测试
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16.4-alpine3.20
        env:
          POSTGRES_DB: risk_test
          POSTGRES_USER: risk_test
          POSTGRES_PASSWORD: ci_only_postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U risk_test -d risk_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7.2.5-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://risk_test:ci_only_postgres_password@127.0.0.1:5432/risk_test
      REDIS_URL: redis://127.0.0.1:6379/0
      REDIS_CACHE_ENABLED: "true"
      AUTH_JWT_SECRET: ci-only-placeholder-not-for-production
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装后端依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pytest>=8,<10"

      - name: Python 编译检查
        run: |
          python -m compileall -q backend/app backend/tests
          if [ -d scripts ]; then
            python -m compileall -q scripts
          fi

      - name: 执行 Alembic 迁移
        run: |
          if [ -f backend/alembic.ini ]; then
            (cd backend && python -m alembic upgrade head)
          elif [ -f alembic.ini ]; then
            python -m alembic upgrade head
          else
            echo "Alembic 配置尚未落盘，当前提交跳过迁移步骤。"
          fi

      - name: 后端测试
        run: python -m pytest backend/tests -q

  frontend:
    name: 前端依赖、构建与 Compose 校验
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: 前端生产构建
        working-directory: frontend
        run: npm run build

      - name: Compose 配置校验
        run: docker compose config --quiet
