<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>气象个例智能检索</title>
  <style>
    :root{--bg:#f4f6f8;--surface:#fff;--text:#17202a;--muted:#637083;--line:#d9dee7;--brand:#155e75;--soft:#e8f3f5;--danger:#b42318}
    *{box-sizing:border-box;letter-spacing:0}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif}button,textarea{font:inherit}button{cursor:pointer}.app{height:100%;display:grid;grid-template-rows:58px minmax(0,1fr) auto}.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:#153b47;color:#fff}.brand h1{margin:0;font-size:18px}.brand p{margin:3px 0 0;color:#cde0e5;font-size:12px}.range{color:#d9edf1;font-size:12px}.conversation{overflow-y:auto}.thread{width:min(1060px,calc(100% - 32px));margin:auto;padding:28px 0 120px}.welcome{text-align:center;padding:16vh 16px 28px}.welcome-mark{width:46px;height:46px;margin:0 auto 16px;display:grid;place-items:center;border-radius:8px;background:var(--brand);color:#fff;font-size:20px;font-weight:700}.welcome h2{margin:0 0 10px;font-size:28px}.welcome p{margin:0;color:var(--muted)}.turn{margin:0 0 34px}.user-row{display:flex;justify-content:flex-end;margin-bottom:20px}.user-message{max-width:min(780px,86%);padding:12px 15px;border-radius:8px;background:#27362f;color:#fff;line-height:1.7;white-space:pre-wrap}.assistant-row{display:grid;grid-template-columns:34px minmax(0,1fr);gap:13px}.assistant-mark{width:34px;height:34px;border-radius:7px;display:grid;place-items:center;background:var(--soft);color:var(--brand);font-weight:700}.agent-name{margin:0 0 4px;color:var(--brand);font-size:12px;font-weight:700}.assistant-content{min-width:0;padding-top:3px}.status{display:flex;align-items:center;gap:8px;min-height:27px;color:var(--muted);font-size:14px}.spinner{width:15px;height:15px;border:2px solid #c8d4ce;border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite}.done .spinner{display:none}.error{color:var(--danger)}@keyframes spin{to{transform:rotate(360deg)}}.panel,.section{margin-top:12px;padding:14px 16px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}.panel{border-left:4px solid var(--brand)}.panel h3{margin:0 0 8px;font-size:16px}.conditions{margin:0;padding-left:20px;line-height:1.7}.actions{display:flex;gap:8px;margin-top:12px}.button{min-height:36px;padding:7px 13px;border:1px solid transparent;border-radius:6px;color:#fff;background:var(--brand);font-weight:600}.button.secondary{color:var(--text);background:#fff;border-color:var(--line)}.meta{color:var(--muted);font-size:12px;line-height:1.6}.pdf-card{max-width:700px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}.pdf-head{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}.pdf-icon{display:grid;place-items:center;width:32px;height:32px;border-radius:4px;background:#b42318;color:#fff;font-size:11px;font-weight:700}.pdf-head strong,.pdf-head span{display:block}.pdf-head strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pdf-head span{margin-top:3px;color:var(--muted);font-size:12px}.pdf-actions{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}.pdf-actions .meta{margin-right:auto}.case-list{display:grid;gap:12px}.case-card{padding:16px;border:1px solid var(--line);border-radius:6px;background:#fff}.case-head{display:flex;justify-content:space-between;gap:12px}.case-head h4{margin:0;font-size:15px;line-height:1.5}.score{color:#126447;font-weight:700}.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.tag{padding:3px 8px;border-radius:5px;background:#e7f2ed;color:#245b46;font-size:12px}.list{margin:8px 0 0;padding-left:20px}.list li{margin:5px 0;line-height:1.65;font-size:13px}.evidence-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}.evidence-button{padding:3px 7px;border:1px solid #b8cbd0;border-radius:4px;background:#f4fafb;color:var(--brand);font-size:12px}.summary{padding:12px 14px;border-left:3px solid #126447;background:#f7f9f8;line-height:1.7}.composer-shell{position:sticky;bottom:0;padding:10px 0 13px;background:rgba(244,246,248,.96);border-top:1px solid var(--line)}.composer{width:min(1060px,calc(100% - 32px));margin:auto}.composer-box{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end;padding:8px;border:1px solid #9aa7b5;border-radius:6px;background:#fff}.composer textarea{min-height:44px;max-height:150px;resize:vertical;border:0;outline:0;padding:7px;line-height:1.55}.hint{margin:5px 3px 0;color:var(--muted);font-size:12px}.side-preview{display:none;position:fixed;right:0;top:58px;bottom:0;width:min(52vw,700px);z-index:10;background:#fff;border-left:1px solid var(--line);padding:12px}.side-preview header{display:flex;justify-content:space-between;align-items:center}.side-preview iframe{width:100%;height:calc(100% - 42px);border:0;margin-top:8px}.evidence-dialog{width:min(760px,calc(100% - 24px));border:1px solid var(--line);border-radius:6px;padding:0}.evidence-dialog::backdrop{background:rgba(0,0,0,.35)}.evidence-dialog header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}.evidence-dialog .dialog-body{padding:14px;max-height:70vh;overflow:auto}.evidence-dialog img{max-width:100%;height:auto}@media(max-width:700px){.topbar{padding:0 12px}.range{display:none}.thread,.composer{width:calc(100% - 24px)}.composer-box{grid-template-columns:1fr auto}.side-preview{width:100%}}
  </style>
  <style>
    /* 多维报告卡片与旧统一页面保持一致，生成期间也保留稳定的预览占位。 */
    .pdf-card{max-width:700px;overflow:hidden;border:1px solid var(--line);border-radius:6px;background:#fff;box-shadow:0 8px 24px rgba(31,50,61,.08)}
    .pdf-card-head{display:flex;align-items:center;gap:11px;min-height:54px;padding:10px 14px;border-bottom:1px solid var(--line)}
    .pdf-card-title{min-width:0;flex:1}.pdf-card-title strong{display:block;overflow:hidden;font-size:14px;text-overflow:ellipsis;white-space:nowrap}.pdf-card-title span{display:block;margin-top:3px;color:var(--muted);font-size:12px}
    .pdf-thumbnail{position:relative;height:318px;overflow:hidden;background:#e9edf1}.pdf-thumbnail embed{width:100%;height:470px;border:0;pointer-events:none}.pdf-thumbnail-button{position:absolute;inset:0;width:100%;border:0;color:transparent;background:transparent}.pdf-thumbnail-button:focus-visible{outline:3px solid #1677ff;outline-offset:-3px}
    .pdf-loading{position:absolute;inset:0;z-index:1;display:grid;place-items:center;color:var(--muted);background:linear-gradient(110deg,#eef1f4 30%,#f8fafb 45%,#eef1f4 60%);background-size:240% 100%;animation:pdf-loading 1.4s linear infinite}.pdf-loading.error{color:var(--danger);background:#fff1f0;animation:none}@keyframes pdf-loading{to{background-position-x:-240%}}
    .pdf-card-actions{display:flex;align-items:center;gap:8px;padding:11px 14px;border-top:1px solid var(--line)}.pdf-card-actions .pdf-meta{margin-right:auto;color:var(--muted);font-size:12px}
    .pdf-card-actions button:disabled{cursor:not-allowed}
  </style>
</head>
<body><div class="app"><header class="topbar"><div class="brand"><h1>气象个例智能检索</h1><p>意图分发智能体自动选择检索任务</p></div><div><span id="range" class="range">知识库范围读取中</span><button id="newChat" class="button secondary" type="button" style="margin-left:12px">新建会话</button></div></header><main id="conversation" class="conversation" aria-live="polite"><div id="thread" class="thread"><section id="welcome" class="welcome"><div class="welcome-mark">案</div><h2>描述天气过程，系统自动识别任务</h2><p>历史条件筛选进入多维检索，当前或新过程描述进入相似个例匹配。</p></section></div></main><footer class="composer-shell"><form id="composer" class="composer"><div class="composer-box"><textarea id="input" maxlength="6000" placeholder="输入天气过程、日期、灾种、区域或相似匹配需求…" aria-label="天气过程描述"></textarea><button id="send" class="button" type="submit">发送</button></div><p class="hint">系统会先由意图分发智能体判断任务类型；历史检索仍保留原确认步骤。</p></form></footer></div><aside id="pdfPreviewPanel" class="side-preview"><header><strong id="previewTitle">PDF 报告</strong><button id="previewClose" class="button secondary" type="button">关闭</button></header><iframe id="previewFrame" title="PDF 报告预览"></iframe></aside><dialog id="evidenceDialog" class="evidence-dialog"><header><strong id="evidenceTitle">证据</strong><button class="button secondary" type="button" onclick="this.closest('dialog').close()">关闭</button></header><div id="evidenceBody" class="dialog-body"></div></dialog>
<script>
const thread=document.getElementById("thread"),conversation=document.getElementById("conversation"),input=document.getElementById("input"),send=document.getElementById("send"),range=document.getElementById("range");
const state={busy:false,conversationId:localStorage.getItem("caseIntentMultidimConversation")||"",previousIntent:null,pdfUrls:new Set(),images:new Map()};
const esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
const scroll=()=>requestAnimationFrame(()=>conversation.scrollTop=conversation.scrollHeight);
function setBusy(value){state.busy=value;send.disabled=value;input.disabled=value;send.textContent=value?"处理中":"发送"}
function status(el,text,kind="running"){const node=el.querySelector(".status");node.classList.toggle("done",kind==="done");node.classList.toggle("error",kind==="error");node.querySelector(".status-text").textContent=text}
function turn(message){document.getElementById("welcome")?.remove();const el=document.createElement("section");el.className="turn";el.innerHTML=`<div class="user-row"><div class="user-message">${esc(message)}</div></div><div class="assistant-row"><div class="assistant-mark">意</div><div class="assistant-content"><div class="agent-name">意图分发智能体</div><div class="status"><span class="spinner"></span><span class="status-text">正在识别任务类型</span></div><div class="body"></div></div></div>`;thread.appendChild(el);scroll();return el}
async function jsonRequest(url,payload){const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});if(!r.ok){let t=await r.text();try{t=JSON.parse(t).detail||t}catch(_){ }throw Error(t||`请求失败(${r.status})`)}return r.json()}
async function loadRange(){try{const r=await fetch("/api/query-intent/knowledge-range");const d=await r.json();range.textContent=d.end_date?`本地知识库：${d.start_date} 至 ${d.end_date}`:"本地知识库范围不可用"}catch(_){range.textContent="本地知识库范围读取失败"}}
function renderClarify(el,data,message){el.querySelector(".agent-name").textContent="意图分发智能体";el.querySelector(".body").innerHTML=`<div class="panel"><h3>需要确认任务类型</h3><p>${esc(data.clarification_question||"请明确本轮是历史条件检索还是相似个例匹配。")}</p>${data.suggested_intent?`<div class="meta">当前倾向：${data.suggested_intent==="multidim_search"?"多维检索":"相似个例匹配"}</div>`:""}</div>`;status(el,"等待确认任务类型","done")}
function renderDispatch(el,data){const name=data.intent==="multidim_search"?"多维检索智能体":"相似个例智能体";el.querySelector(".assistant-mark").textContent=data.intent==="multidim_search"?"检":"案";el.querySelector(".agent-name").textContent=name;el.querySelector(".body").innerHTML=`<div class="panel"><h3>任务已分发</h3><div>已识别为：${esc(name)}</div><div class="meta">置信度 ${(Number(data.confidence||0)*100).toFixed(0)}% · ${esc(data.reason||"")}</div></div>`;return name}
function renderProposal(el,data){const lines=(data.display_lines||[]).map(x=>`<li>${esc(x)}</li>`).join("");el.querySelector(".body").insertAdjacentHTML("beforeend",`<div class="panel"><h3>请核对多维检索条件</h3><ul class="conditions">${lines||"<li>暂无可展示条件</li>"}</ul><div class="actions"><button class="button" data-confirm type="button" ${data.can_confirm?"":"disabled"}>确认并开始检索</button></div></div>`);el.querySelector("[data-confirm]")?.addEventListener("click",()=>confirmMultidim(el,data));status(el,"多维检索智能体：请核对检索条件","done")}
function pdfFilename(title){return((title||"山西省气象灾害个例多维分析报告")+".pdf").replace(/[\\/:*?"<>|]/g,"_")}
async function renderMultidimPdfCard(el,data){
  const title=data.title||"山西省气象灾害个例多维分析报告";
  const filename=pdfFilename(title);
  const count=Number(data.search_response?.displayed_result_count??data.search_response?.result_count??0);
  const card=document.createElement("article");
  card.className="pdf-card";
  card.innerHTML=`<div class="pdf-card-head"><span class="pdf-icon" aria-hidden="true">PDF</span><div class="pdf-card-title"><strong>${esc(filename)}</strong><span data-pdf-status>正在生成与下载内容一致的预览文件</span></div></div><div class="pdf-thumbnail"><div class="pdf-loading" data-pdf-loading>正在排版正式报告…</div><embed data-pdf-thumbnail type="application/pdf" title="PDF 第一页缩略预览"><button class="pdf-thumbnail-button" data-pdf-open type="button" disabled>查看完整报告</button></div><div class="pdf-card-actions"><span class="pdf-meta">${count} 个命中个例</span><button class="button secondary" data-pdf-open-button type="button" disabled>查看</button><button class="button" data-pdf-download type="button" disabled>下载 PDF</button></div>`;
  const section=document.createElement("div");
  section.className="section";
  section.appendChild(card);
  el.querySelector(".body").appendChild(section);
  scroll();
  try{
    // 先展示稳定的加载卡片，再请求 PDF，避免用户只看到一行结果文字。
    status(el,"多维检索智能体：正在生成 PDF 报告");
    const response=await fetch("/api/case-multidim/export-pdf",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({answer_id:data.answer_id,filename,report_title:title})});
    if(!response.ok)throw Error(await response.text());
    const blob=await response.blob();
    const url=URL.createObjectURL(blob);
    state.pdfUrls.add(url);
    card.querySelector("[data-pdf-thumbnail]").src=url+"#page=1&toolbar=0&navpanes=0&scrollbar=0&view=FitH";
    card.querySelector("[data-pdf-loading]").remove();
    card.querySelector("[data-pdf-status]").textContent=`生成日期：${new Date().toLocaleDateString("zh-CN")} · ${Math.round(blob.size/1024)} KB`;
    const openPreview=()=>{const frame=document.getElementById("previewFrame"),panel=document.getElementById("pdfPreviewPanel");if(frame&&panel){frame.src=url+"#toolbar=1&navpanes=0";document.getElementById("previewTitle").textContent=title;panel.style.display="block"}};
    card.querySelector("[data-pdf-open]").disabled=false;
    card.querySelector("[data-pdf-open]").addEventListener("click",openPreview);
    card.querySelector("[data-pdf-open-button]").disabled=false;
    card.querySelector("[data-pdf-open-button]").addEventListener("click",openPreview);
    const download=card.querySelector("[data-pdf-download]");
    download.disabled=false;
    download.addEventListener("click",()=>{const link=document.createElement("a");link.href=url;link.download=filename;link.click()});
    status(el,"多维检索智能体：检索完成","done");
  }catch(error){
    card.querySelector("[data-pdf-status]").textContent="PDF 生成失败";
    const loading=card.querySelector("[data-pdf-loading]");
    loading.textContent="无法生成报告："+error.message;
    loading.classList.add("error");
    throw error;
  }
}
async function confirmMultidim(el,proposal){const button=el.querySelector("[data-confirm]");if(button){button.disabled=true;button.textContent="检索中"}status(el,"多维检索智能体：正在筛选历史个例");try{const progressId=crypto.randomUUID?crypto.randomUUID():String(Date.now());const data=await jsonRequest("/api/case-multidim/natural/search",{conversation_id:proposal.conversation_id||state.conversationId,proposal_id:proposal.proposal_id,progress_id:progressId});await renderMultidimPdfCard(el,data)}catch(e){status(el,e.message,"error")}}
function renderList(values,withEvidence=false){if(!values?.length)return"<div class='meta'>暂无</div>";return`<ul class="list">${values.map(v=>{const o=v&&typeof v==='object',chunks=o?v.evidence_chunk_ids||[]:[],images=o?v.evidence_image_refs||[]:[];return`<li>${esc(o?v.text||"":v)}${withEvidence&&chunks.length?`<div class="evidence-row"><span class="meta">文字证据</span>${chunks.map(id=>`<button class="evidence-button" data-chunk-id="${esc(id)}" type="button">${esc(id)}</button>`).join("")}</div>`:""}${withEvidence&&images.length?`<div class="evidence-row"><span class="meta">图片证据</span>${images.map(x=>`<button class="evidence-button" data-image-id="${esc(x.image_id)}" type="button">${esc(x.label||x.image_id)}</button>`).join("")}</div>`:""}</li>`}).join("")}</ul>`}
function renderSimilar(el,data){const cases=data.matched_cases||[],summary=data.forecast_summary||{};cases.forEach(item=>[...(item.evidence_images||[]),...(item.supplemental_images||[])].forEach(x=>state.images.set(String(x.image_id),x)));el.querySelector(".body").innerHTML=`<div class="section"><h3>匹配个例 <span class="meta">${cases.length} 个</span></h3><div class="case-list">${cases.length?cases.map((item,i)=>`<article class="case-card"><div class="case-head"><h4>${esc(item.rank||i+1)}. ${esc(item.title||"历史个例")}</h4><span class="score">${Math.round(Number(item.retrieval_score||0)*100)}%</span></div><div class="meta">${esc(item.date_range||"")} · ${esc(item.source_pdf||"")}</div><div class="tags">${[...(item.disaster_types||[]),...(item.affected_areas||[])].map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</div><h4>匹配理由</h4>${renderList(item.match_reasons,true)}<h4>参考经验</h4>${renderList(item.key_references,true)}<h4>关键差异</h4>${renderList(item.key_differences)}${item.historical_warnings?.length?`<h4>过程前历史预警</h4>${renderList(item.historical_warnings)}`:""}</article>`).join(""):"<div class='meta'>没有达到质量门槛的历史个例</div>"}</div>${summary.similarity_assessment||summary.main_risk?`<div class="section"><h3>综合研判</h3><div class="summary">${summary.similarity_assessment?`<p>${esc(summary.similarity_assessment)}</p>`:""}${summary.main_risk?`<p>${esc(summary.main_risk)}</p>`:""}</div>${renderList(data.forecast_tips)}</div>`:""}`;const done=data.status==="completed"||data.status==="degraded";status(el,done?"相似个例智能体：匹配完成":"相似个例智能体：正在处理",done?"done":"running")}
async function consumeSse(response,handler){if(!response.ok)throw Error((await response.text())||`请求失败(${response.status})`);const reader=response.body.getReader(),decoder=new TextDecoder();let buffer="";while(true){const x=await reader.read();buffer+=decoder.decode(x.value||new Uint8Array(),{stream:!x.done});const parts=buffer.split(/\r?\n\r?\n/);buffer=parts.pop()||"";for(const block of parts){let event="message",lines=[];for(const line of block.split(/\r?\n/)){if(line.startsWith("event:"))event=line.slice(6).trim();if(line.startsWith("data:"))lines.push(line.slice(5).trim())}if(lines.length)handler(event,JSON.parse(lines.join("\n")))}if(x.done)break}}
async function submitSimilar(el,message){const r=await fetch("/api/smart-case-match/conversation/stream",{method:"POST",headers:{"Content-Type":"application/json","Accept":"text/event-stream"},body:JSON.stringify({message})});const aggregate={matched_cases:[],forecast_summary:{},forecast_tips:[],status:"processing"};let failed=false,completed=false;await consumeSse(r,(event,data)=>{if(event==="accepted"||event==="stage")status(el,`相似个例智能体：${data.message||"正在处理"}`);if(event==="matched_cases"){Object.assign(aggregate,{matched_cases:data.matched_cases||[],warnings:data.warnings||[]});renderSimilar(el,aggregate)}if(event==="forecast"){Object.assign(aggregate,{forecast_summary:data.forecast_summary||{},forecast_tips:data.forecast_tips||[],warnings:data.warnings||[]});renderSimilar(el,aggregate)}if(event==="completed"){completed=true;Object.assign(aggregate,data);renderSimilar(el,aggregate)}if(event==="error"){failed=true;status(el,data.message||"匹配失败","error")}});if(!completed&&!failed){aggregate.status="degraded";renderSimilar(el,aggregate)}}
async function submit(message){const el=turn(message);setBusy(true);try{const route=await jsonRequest("/api/query-intent/route",{message,previous_intent:state.previousIntent});if(route.need_clarification){renderClarify(el,route,message);return}state.previousIntent=route.intent;const agentName=renderDispatch(el,route);if(route.intent==="multidim_search"){const parsed=await jsonRequest("/api/case-multidim/natural/parse",{message:route.normalized_message,conversation_id:state.conversationId});state.conversationId=parsed.conversation_id;localStorage.setItem("caseIntentMultidimConversation",state.conversationId);renderProposal(el,parsed)}else{await submitSimilar(el,route.normalized_message)} }catch(e){status(el,e.message,"error")}finally{setBusy(false);input.focus();scroll()}}
document.addEventListener("click",async event=>{const preview=event.target.closest("[data-preview-pdf]");if(preview){const frame=document.getElementById("previewFrame"),panel=document.getElementById("pdfPreviewPanel");if(frame&&panel){frame.src=preview.dataset.previewPdf+"#toolbar=1&navpanes=0";document.getElementById("previewTitle").textContent=preview.dataset.previewTitle||"PDF 报告";panel.style.display="block"}}const chunk=event.target.closest("[data-chunk-id]");if(chunk){const dialog=document.getElementById("evidenceDialog"),body=document.getElementById("evidenceBody");document.getElementById("evidenceTitle").textContent=`文字证据：${chunk.dataset.chunkId}`;body.textContent="正在读取正文";dialog?.showModal();try{const response=await fetch(`/api/smart-case-match/assets/chunks/${encodeURIComponent(chunk.dataset.chunkId)}`);if(!response.ok)throw Error(`读取失败(${response.status})`);const data=await response.json();body.innerHTML=`<p class="meta">${esc(data.source_pdf||"")} · chunk ${esc(data.chunk_no||"")}</p><div>${esc(data.content||"暂无正文")}</div>`}catch(error){body.textContent=error.message}}const image=event.target.closest("[data-image-id]");if(image){const item=state.images.get(String(image.dataset.imageId));if(item){document.getElementById("evidenceTitle").textContent=item.display_no||"证据图片";document.getElementById("evidenceBody").innerHTML=`<img src="${esc(item.url)}" alt="${esc(item.caption||"")}"><p>${esc(item.caption||"")}</p>`;document.getElementById("evidenceDialog")?.showModal()}}});document.getElementById("previewClose")?.addEventListener("click",()=>{document.getElementById("pdfPreviewPanel").style.display="none"});document.getElementById("newChat")?.addEventListener("click",()=>{if(state.busy)return;state.conversationId="";state.previousIntent=null;localStorage.removeItem("caseIntentMultidimConversation");state.pdfUrls.forEach(url=>URL.revokeObjectURL(url));state.pdfUrls.clear();state.images.clear();thread.innerHTML='<section id="welcome" class="welcome"><div class="welcome-mark">案</div><h2>描述天气过程，系统自动识别任务</h2><p>历史条件筛选进入多维检索，当前或新过程描述进入相似个例匹配。</p></section>'});document.getElementById("composer").addEventListener("submit",e=>{e.preventDefault();const message=input.value.trim();if(message&&!state.busy){input.value="";submit(message)}});input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();document.getElementById("composer").requestSubmit()}});loadRange();
